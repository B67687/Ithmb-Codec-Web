name: pages-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build (TS -> JS in place)
        run: npm run build
      - name: Stage deployable site
        run: |
          mkdir _site
          rsync -a --exclude=node_modules --exclude=.git --exclude=.github --exclude=_site ./ _site/
          # The -Dev scratch repo deploys to its default github.io preview;
          # only the public repo may claim the custom domain (CNAME file).
          if [[ "${GITHUB_REPOSITORY##*/}" == *-Dev ]]; then rm -f _site/CNAME; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
