<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="notfound.title">404 — Page Not Found | ITHMB Codec</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/ithmb-decoder/styles.css?v=2" />
    <style>
      .container { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; min-height: calc(100vh - 100px); }
      .error-section { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
      .error-section h1 { font-size: 3rem; font-weight: 700; margin-bottom: 8px; color: var(--text); }
      .error-section p { font-size: 1.1rem; color: var(--muted); margin-bottom: 24px; line-height: 1.55; }
      .error-section a { display: inline-block; background: var(--accent); color: #fff; padding: 10px 24px; border-radius: var(--radius); text-decoration: none; font-weight: 500; transition: opacity 0.2s; }
      .error-section a:hover { opacity: 0.85; }
      .error-section { transform: translateY(-8%); } /* raise content slightly above center */
    </style>
  </head>
  <body>
    <script src="/nav.js?v=2"></script>
    <div class="container">
      <div class="error-section">
        <h1>404</h1>
        <p data-i18n="notfound.msg">Page not found. The file you're looking for doesn't exist or has moved.</p>
        <a href="/" data-i18n="notfound.back">Back to Home</a>
      </div>
      <script src="/footer.js?v=2"></script>
    </div>
  </body>
</html>
